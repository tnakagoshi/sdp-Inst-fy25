{% extends 'base.html' %}

{% block title %} 備品貸出 {% endblock %}

{% block content %}
<form method="POST" enctype="multipart/form-data" class="p-4 m-4 bg-light border border-success rounded form-group">{% csrf_token %}

    <label for="supplies">備品:</label>
    <span>{{supplies.title}}</span>
    <input type="hidden" name="supplies" value="{{ supplies.pk }}">
    {{form.as_p}}
    <button>貸出</button>
</form>
{% endblock %}
